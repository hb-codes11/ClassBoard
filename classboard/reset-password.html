<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0868bd" />
  <title>Reset password — Classboard</title>
  <link rel="icon" type="image/svg+xml" href="./classboard-logo.svg" />
  <link rel="manifest" href="./site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light; --blue:#0868bd; --page:#f4f8fc; --surface:#fff; --surface-2:#f8fafc; --text:#17283d; --muted:#738196; --line:#e6ebf1; --shadow:0 10px 30px rgba(29,59,91,.08); }
    [data-theme="dark"] { color-scheme:dark; --blue:#4b9bed; --page:#000; --surface:#0a0a0a; --surface-2:#111; --text:#e8eff8; --muted:#98a9bd; --line:#292929; --shadow:0 10px 30px rgba(0,0,0,.32); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--page); color:var(--text); font:16px/1.55 Inter,Arial,sans-serif; }
    .card { width:min(100%,440px); padding:32px; border:1px solid var(--line); border-radius:20px; background:var(--surface); box-shadow:var(--shadow); }
    .brand { display:flex; align-items:center; gap:10px; color:var(--blue); font-size:13px; font-weight:750; letter-spacing:.07em; text-transform:uppercase; }
    .brand img { width:34px; height:34px; }
    h1 { margin:18px 0 6px; font-size:27px; letter-spacing:-.035em; }
    .copy { margin:0 0 22px; color:var(--muted); font-size:14px; }
    label { display:grid; gap:7px; margin:15px 0; font-size:13px; font-weight:650; }
    input { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2); color:var(--text); font:inherit; }
    button { width:100%; margin-top:10px; padding:12px 16px; border:1px solid var(--blue); border-radius:10px; background:var(--blue); color:white; font:inherit; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .message { min-height:24px; margin:14px 0 0; color:var(--muted); font-size:13px; }
    .message.error { color:#c0392b; }
    .back { display:block; margin-top:18px; color:var(--blue); text-align:center; font-size:14px; font-weight:650; text-decoration:none; }
    [hidden] { display:none !important; }
  </style>
  <script>try { if (localStorage.getItem('class-hub-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (_) {}</script>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="./classboard-logo.svg" alt="" />Classboard · INTEL-1</div>
    <h1>Choose a new password</h1>
    <p class="copy">Enter a new password for your Classboard account.</p>
    <p class="message" id="resetStatus" role="status" aria-live="polite">Checking your password reset link…</p>
    <form id="newPasswordForm" hidden>
      <label for="newPassword">New password
        <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters" />
      </label>
      <label for="confirmPassword">Confirm new password
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Enter it again" />
      </label>
      <button id="savePasswordButton" type="submit">Save new password</button>
    </form>
    <a class="back" href="./">Back to sign in</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script>
    (() => {
      const form = document.getElementById('newPasswordForm');
      const status = document.getElementById('resetStatus');
      const saveButton = document.getElementById('savePasswordButton');
      const query = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const resetCallback = query.has('code') || hash.get('type') === 'recovery';
      let supabase;
      let ready = false;

      function setStatus(text, isError = false) {
        status.textContent = text;
        status.classList.toggle('error', isError);
      }

      function enableReset() {
        if (ready) return;
        ready = true;
        form.hidden = false;
        status.textContent = 'Choose a strong password with at least 8 characters.';
      }

      async function init() {
        const config = window.CLASSBOARD_SUPABASE_CONFIG;
        if (!window.supabase?.createClient || !config?.url || !config?.publishableKey) {
          setStatus('Classboard could not connect to account services. Reload the page and try again.', true);
          return;
        }
        supabase = window.supabase.createClient(config.url, config.publishableKey);
        supabase.auth.onAuthStateChange((event, session) => {
          if (event === 'PASSWORD_RECOVERY' && session) enableReset();
        });
        const { data, error } = await supabase.auth.getSession();
        if (error) {
          setStatus('This reset link is invalid or expired. Request a new password reset from sign in.', true);
          return;
        }
        if (data.session && resetCallback) enableReset();
        else if (!ready) setStatus('This reset link is invalid or expired. Request a new password reset from sign in.', true);
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const password = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;
        if (password.length < 8) { setStatus('Use a password with at least 8 characters.', true); return; }
        if (password !== confirm) { setStatus('Those passwords do not match. Try again.', true); return; }
        saveButton.disabled = true;
        setStatus('Saving your new password…');
        const { error } = await supabase.auth.updateUser({ password });
        if (error) {
          setStatus(error.message, true);
          saveButton.disabled = false;
          return;
        }
        setStatus('Password updated. Taking you back to sign in…');
        await supabase.auth.signOut();
        window.setTimeout(() => { window.location.replace('./'); }, 1200);
      });

      init().catch(() => setStatus('Could not verify this reset link. Request a new one from sign in.', true));
    })();
  </script>
</body>
</html>
